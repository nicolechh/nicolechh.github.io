<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Not found — Nicole Chou</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Geist+Pixel&display=swap">
<style>
  :root{
    --paper:#EFEFEB; --ink:#16171A; --ink-2:#4D5055; --accent:#C03E0F;
    --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
    --name:"Geist Pixel","Geist",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{ --paper:#131417; --ink:#E9E9E4; --ink-2:#A4A6AE; --accent:#FF7A40; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
    font-family:var(--body); display:flex; flex-direction:column;
    align-items:flex-start; justify-content:center; gap:22px;
    padding:clamp(28px,8vw,96px);
  }
  h1{ font-family:var(--name); font-weight:400; text-transform:uppercase;
      font-size:clamp(2rem,9vw,5rem); line-height:1; margin:0; }
  p{ font-size:clamp(1rem,2vw,1.3rem); color:var(--ink-2); margin:0; max-width:44ch; line-height:1.4; }
  a{ font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase;
     color:var(--accent); text-decoration:none; border-bottom:1px solid transparent; padding:6px 0; }
  a:hover,a:focus-visible{ border-bottom-color:var(--accent); }
  .code{ font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--ink-2); text-transform:uppercase; }
</style>
</head>
<body>
  <span class="code">Error 404 — off the artboard</span>
  <h1>Nothing here</h1>
  <p>That page doesn't exist, or it moved. Everything lives on one canvas anyway.</p>
  <a href="/">← Back to the start</a>
</body>
</html>
